# ============================================
# 最简 VMess TCP 配置 — 调试/首次连通首选
# 替换 VPS_IP, PORT, UUID 后直接导入 Clash Verge
# ============================================

mixed-port: 7897
socks-port: 7898
port: 7899
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9097
secret: ''
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
  fallback:
    - 8.8.8.8

proxies:
  - name: "US"
    type: vmess
    server: VPS_IP
    port: PORT
    uuid: CLIENT_UUID
    alterId: 0
    cipher: auto
    udp: true

proxy-groups:
  - name: "Proxy"
    type: select
    proxies:
      - "US"
      - DIRECT

rules:
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
