# grok-build skill 配置 —— Adapter 读取，翻译为 grok headless CLI 旗标
# 红线：此文件只影响 adapter 行为，Hermes core 对其无感知

grok:
  binary: grok                      # PATH 命令名或绝对路径
  proxy: null                       # DeepSeek 官方直连，无需代理
  env:
    GROK_MEMORY: "0"                # 禁用 Grok 内建记忆（记忆主权归 Hermes）

defaults:
  model: deepseek-v4                # DeepSeek 官方 API（≈硅基 1/4 价格，国内直连）
  output_format: json               # v0.1 用 json；v0.2 升级 streaming-json
  max_turns: 30
  timeout_seconds: 900
  policy: guarded

policies:
  readonly:
    tools: "read_file,grep,list_dir"
  guarded:
    allow:
      - "Edit(**)"
      - "Write(**)"
      - "Bash(git*)"
      - "Bash(python*)"
      - "Bash(pip*)"
      - "Bash(pytest*)"
      - "Bash(uv*)"
      - "Bash(npm*)"
      - "Bash(node*)"
    deny:
      - "Bash(rm -rf*)"
      - "Bash(sudo*)"
      - "Bash(format*)"
      - "WebFetch"
  auto:
    yolo: true

verification:
  git_diff: true                    # envelope 附 git 独立核验
  auto_git_init: true               # workdir 非 git 仓库时自动 git init

memory_writeback:
  digest_max_chars: 500             # 任务书自动追加"≤N字总结"要求
